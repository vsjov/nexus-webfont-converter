name: "Lint, test and build"

on:
  push:
    branches: [ "master", "release/**" ]
    tags: ["v*.*.*"]
  pull_request:
    branches: [ "**" ]

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  ############################
  #                          #
  #   Lint, test and build   #
  #                          #
  ############################
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      # Checkout
      # --------
      - name: Clone the nexus-webfont-converter repository
        uses: actions/checkout@v6
        with:
          path: nexus-webfont-converter

      # Install dependencies
      # --------------------
      - name: Install nexus-webfont-converter
        uses: ./nexus-webfont-converter/.github/actions/install-package
        with:
          package-name: nexus-webfont-converter
          node-version: 24

      # Lint, test, build
      # -----------------
      - name: Run Oxfmt check
        shell: bash
        run: |
          cd nexus-webfont-converter
          npm run format:check

      - name: Run Oxlint
        shell: bash
        run: |
          cd nexus-webfont-converter
          npm run lint

      - name: Run tests
        shell: bash
        run: |
          cd nexus-webfont-converter
          npm test

      - name: Run release script tests
        shell: bash
        run: |
          cd nexus-webfont-converter
          npm run test:scripts

      - name: Run release validator tests
        shell: bash
        run: |
          cd nexus-webfont-converter
          npm run test:tools

      - name: Build
        shell: bash
        run: |
          cd nexus-webfont-converter
          npm run build

      - name: Build release validator
        shell: bash
        run: |
          cd nexus-webfont-converter
          npm run build:tools

      - name: Check package contents
        shell: bash
        run: |
          cd nexus-webfont-converter
          npm run pack:check

      # Check that install and build output are committed
      # -------------------------------------------------
      - name: Check for uncommitted files
        id: changes-working-tree
        shell: bash
        run: |
          cd nexus-webfont-converter
          if [[ `git status --porcelain` ]]; then
            echo "changes=true" >> $GITHUB_OUTPUT
          else
            echo "changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Fail if install or build output is uncommitted
        if: steps.changes-working-tree.outputs.changes == 'true'
        shell: bash
        run: |
          echo "::error::Install or build output differs from committed files. Run the checks locally and commit the expected changes."
          exit 1

  ############################
  #                          #
  #   Rust workspace checks  #
  #                          #
  ############################
  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Clone the nexus-webfont-converter repository
        uses: actions/checkout@v6
        with:
          path: nexus-webfont-converter

      - name: Install NodeJS dependencies for compatibility checks
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install npm dependencies
        working-directory: nexus-webfont-converter
        run: npm ci --ignore-scripts --loglevel error

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.89.0
          components: clippy,rustfmt

      - name: Cache Cargo dependencies and build output
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
        with:
          workspaces: nexus-webfont-converter

      - name: Check Rust formatting
        working-directory: nexus-webfont-converter
        run: cargo fmt --check

      - name: Lint Rust workspace
        working-directory: nexus-webfont-converter
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test Rust workspace
        working-directory: nexus-webfont-converter
        run: cargo test --workspace --all-features

      - name: Verify Rust codec against the TypeScript oracle
        working-directory: nexus-webfont-converter
        run: npm run test:rust-compat

      - name: Install Cargo Deny
        run: cargo install cargo-deny --version 0.20.2 --locked

      - name: Enforce dependency policy
        working-directory: nexus-webfont-converter
        run: cargo deny check

  ###########################
  #                         #
  #   Publish NPM package   #
  #                         #
  ###########################
  publish-npm-package:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: test-and-build
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      # Checkout
      # --------
      - name: Clone the nexus-webfont-converter repository with release history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          path: nexus-webfont-converter

      # Install NodeJS
      # --------------
      - name: Install NodeJS for NPM trusted publishing
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: "https://registry.npmjs.org"

      # Install dependencies
      # --------------------
      - name: Install nexus-webfont-converter dependencies
        shell: bash
        run: |
          cd nexus-webfont-converter
          npm ci --ignore-scripts --loglevel error

      # Validate release source
      # -----------------------
      - name: Build release validator
        shell: bash
        run: |
          cd nexus-webfont-converter
          npm run build:tools

      - name: Validate release tag and branch
        shell: bash
        run: |
          cd nexus-webfont-converter
          npm run validate:release-tag -- "$GITHUB_REF_NAME"

      # Guard against duplicate versions
      # --------------------------------
      - name: Confirm package version is not published
        shell: bash
        run: |
          cd nexus-webfont-converter
          set +e
          npm_view_output=$(npm view "nexus-webfont-converter@${GITHUB_REF_NAME#v}" version --registry=https://registry.npmjs.org 2>&1)
          npm_view_status=$?
          set -e

          if [[ $npm_view_status -eq 0 ]]; then
            echo "::error::nexus-webfont-converter@${GITHUB_REF_NAME#v} is already published."
            exit 1
          fi

          if [[ $npm_view_output != *"E404"* ]]; then
            echo "$npm_view_output"
            echo "::error::Unable to confirm that the package version is unpublished."
            exit 1
          fi

      # Build package contents
      # ----------------------
      - name: Build package for publish
        shell: bash
        run: |
          cd nexus-webfont-converter
          npm run build
          npm run pack:check

      # Publish
      # -------
      - name: Publish NPM package
        shell: bash
        run: |
          cd nexus-webfont-converter
          npm publish --ignore-scripts --access public

  #################################
  #                               #
  #   Build native CLI binaries   #
  #                               #
  #################################
  release-native-binaries:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: rust
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            binary: wfc
            asset: wfc-linux-x64
          - os: macos-13
            target: darwin-x64
            binary: wfc
            asset: wfc-darwin-x64
          - os: macos-14
            target: darwin-arm64
            binary: wfc
            asset: wfc-darwin-arm64
          - os: windows-latest
            target: win32-x64
            binary: wfc.exe
            asset: wfc-win32-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Clone the nexus-webfont-converter repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.89.0

      - name: Cache Cargo dependencies and build output
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae

      - name: Build native wfc binary
        run: cargo build --release --locked --package nexus-webfont-cli

      - name: Stage native release asset
        shell: bash
        run: cp "target/release/${{ matrix.binary }}" "${RUNNER_TEMP}/${{ matrix.asset }}"

      - name: Upload native release asset
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ runner.temp }}/${{ matrix.asset }}
          if-no-files-found: error

  #############################
  #                           #
  #   Create GitHub release   #
  #                           #
  #############################
  create-github-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [publish-npm-package, release-native-binaries]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      # Checkout
      # --------
      - name: Clone the nexus-webfont-converter repository
        uses: actions/checkout@v6
        with:
          path: nexus-webfont-converter

      # Release notes
      # -------------
      - name: Prepare GitHub release notes
        id: release-notes
        shell: bash
        run: |
          cd nexus-webfont-converter
          version="${GITHUB_REF_NAME#v}"
          notes_file="$RUNNER_TEMP/github-release-notes.md"

          awk -v version="$version" '
            $0 ~ "^## \\[" version "\\]" { in_section = 1; next }
            in_section && /^## \[/ { exit }
            in_section { print }
          ' CHANGELOG.md > "$notes_file"

          if ! grep -q '[^[:space:]]' "$notes_file"; then
            echo "::error::CHANGELOG.md does not contain release notes for ${version}."
            exit 1
          fi

          echo "notes-file=$notes_file" >> "$GITHUB_OUTPUT"

      - name: Download native release assets
        uses: actions/download-artifact@v5
        with:
          pattern: wfc-*
          path: ${{ runner.temp }}/wfc-assets
          merge-multiple: false

      # Publish release
      # ---------------
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file "${{ steps.release-notes.outputs.notes-file }}" \
            "$RUNNER_TEMP"/wfc-assets/*/*
